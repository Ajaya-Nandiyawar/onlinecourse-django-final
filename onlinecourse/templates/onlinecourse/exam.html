<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mock Exam</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="card shadow"><div class="card-body p-4">
<h1>{{ lesson.title }}: Mock Exam</h1><p class="text-muted">{{ lesson.course.name }}</p>
<form method="post" action="{% url 'submit' lesson.id %}">{% csrf_token %}<label class="form-label">Student name</label><input class="form-control mb-4" name="student_name" value="Ajay Nandiyawar">
{% for question in lesson.questions.all %}<fieldset class="mb-4"><legend class="h5">{{ forloop.counter }}. {{ question.text }}</legend>{% for choice in question.choices.all %}<div class="form-check"><input class="form-check-input" type="radio" name="question_{{ question.id }}" value="{{ choice.id }}" required><label class="form-check-label">{{ choice.text }}</label></div>{% endfor %}</fieldset>{% endfor %}<button class="btn btn-success btn-lg" type="submit">Submit Exam</button></form>
</div></div></main></body></html>
