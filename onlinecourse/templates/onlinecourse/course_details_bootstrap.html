<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ course.name }} | OnlineCourse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="p-5 mb-4 bg-primary text-white rounded-3 shadow">
      <h1 class="display-5 fw-bold">{{ course.name }}</h1>
      <p class="lead mb-0">{{ course.description }}</p>
      <small>Instructor: {{ course.instructor }}</small>
    </div>
    <h2 class="mb-4">Course Lessons</h2>
    <div class="row g-4">
      {% for lesson in course.lessons.all %}
      <div class="col-md-6">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <span class="badge bg-secondary mb-2">Lesson {{ lesson.order }}</span>
            <h3 class="card-title">{{ lesson.title }}</h3>
            <p class="card-text">{{ lesson.content }}</p>
            <a class="btn btn-outline-primary" href="{% url 'exam' lesson.id %}">Take mock exam</a>
          </div>
        </div>
      </div>
      {% empty %}
      <p>No lessons are available yet.</p>
      {% endfor %}
    </div>
  </main>
</body>
</html>
