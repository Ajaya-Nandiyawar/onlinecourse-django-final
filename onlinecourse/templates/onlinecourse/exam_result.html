<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exam Result</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="card shadow border-success"><div class="card-body p-5 text-center">
<div class="display-1">🎉</div><h1 class="text-success">Congratulations, {{ submission.student_name }}!</h1><p class="lead">You successfully completed the mock exam.</p><div class="alert alert-success fs-4">Score: <strong>{{ submission.score }}/{{ submission.total_questions }}</strong></div><h2 class="h4 text-start mt-4">Exam Results</h2><ul class="list-group text-start mb-4"><li class="list-group-item d-flex justify-content-between"><span>Course</span><strong>{{ submission.lesson.course.name }}</strong></li><li class="list-group-item d-flex justify-content-between"><span>Lesson</span><strong>{{ submission.lesson.title }}</strong></li><li class="list-group-item d-flex justify-content-between"><span>Status</span><strong class="text-success">Passed</strong></li></ul><a class="btn btn-primary" href="{% url 'course-details' submission.lesson.course.id %}">Back to course</a>
</div></div></main></body></html>
